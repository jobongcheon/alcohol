<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나스닥발굴 — 글로벌 성장주 발굴 앱</title>
<style>
:root{
  --bg:#0d1320; --panel:#151e2e; --panel2:#1b2637; --line:#26344a;
  --txt:#e7edf7; --mut:#93a4bd; --dim:#6c7d96;
  --acc:#4dd4ac; --acc2:#3aa9ff; --warn:#f5a623; --bad:#ff5f56; --hot:#ff3b30; --gold:#ffd166;
  --shadow:0 8px 28px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 80px}

/* ── header ── */
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0d1320 70%,rgba(13,19,32,.92));border-bottom:1px solid var(--line)}
.hdr{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.logo{font-size:19px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.tagline{color:var(--dim);font-size:12px}
.mkts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.mkt{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
.mkt.on{background:var(--acc);border-color:var(--acc);color:#06231b}
nav{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--mut);cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
nav button.on{color:var(--txt);border-bottom-color:var(--acc)}
nav button:hover{color:var(--txt)}

/* ── layout ── */
h2{font-size:17px;margin:22px 0 10px;font-weight:700}
h3{font-size:14px;margin:16px 0 8px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ── kpi ── */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .lab{color:var(--mut);font-size:12px;margin-bottom:6px}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px}
.kpi .sub{font-size:11px;color:var(--dim);margin-top:3px}

/* ── controls ── */
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:#0f1725;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.btn{background:var(--acc);color:#06231b;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.dan{background:var(--bad);color:#2c0603}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc);flex:none}

/* ── table ── */
table{width:100%;border-collapse:collapse}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.02)}
.tw{overflow-x:auto}

/* ── badges ── */
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b.re{background:rgba(255,209,102,.16);color:var(--gold);border:1px solid rgba(255,209,102,.4)}
.b.co{background:rgba(77,212,172,.14);color:var(--acc);border:1px solid rgba(77,212,172,.35)}
.b.nw{background:rgba(58,169,255,.14);color:var(--acc2);border:1px solid rgba(58,169,255,.35)}
.b.fa{background:rgba(147,164,189,.12);color:var(--mut);border:1px solid var(--line)}
.b.ok{background:rgba(77,212,172,.14);color:var(--acc)}
.b.no{background:rgba(255,95,86,.15);color:var(--bad)}
.b.wa{background:rgba(245,166,35,.15);color:var(--warn)}
.b.gr{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.score{font-weight:800;font-size:16px}
.s-hi{color:var(--gold)} .s-md{color:var(--acc)} .s-lo{color:var(--mut)}

/* ── alerts ── */
.al{display:flex;gap:10px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px;align-items:flex-start}
.al .ic{font-size:17px;line-height:1.2}
.al.p1{border-color:rgba(255,59,48,.5);background:rgba(255,59,48,.08)}
.al.p2{border-color:rgba(245,166,35,.45);background:rgba(245,166,35,.07)}
.al.p3{border-color:rgba(255,209,102,.35)}
.al.p5{border-color:rgba(58,169,255,.4);background:rgba(58,169,255,.06)}

/* ── timeline ── */
.tl{display:flex;gap:1px;align-items:flex-end;height:26px;overflow:hidden;padding:2px 0}
.tl i{flex:1 1 0;min-width:2px;border-radius:1px;background:#222f44}
.tl i.on{background:var(--acc)}
.tl i.re{background:var(--gold)}
.tl i.hl{background:var(--acc2)}
.tlwrap{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#0f1725}

/* ── misc ── */
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;margin:2px 3px 2px 0}
.hr{height:1px;background:var(--line);margin:14px 0}
.note{border-left:3px solid var(--acc2);background:rgba(58,169,255,.06);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--mut)}
.note.w{border-color:var(--warn);background:rgba(245,166,35,.07)}
.note.d{border-color:var(--bad);background:rgba(255,95,86,.07)}
.blk{border:1px solid rgba(255,95,86,.45);background:rgba(255,95,86,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.pass{border:1px solid rgba(77,212,172,.45);background:rgba(77,212,172,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.bar{height:7px;background:#222f44;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.sec-hd{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.sec-hd h2{margin:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--acc);color:#06231b;padding:11px 20px;border-radius:10px;font-weight:700;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.mask{position:fixed;inset:0;background:rgba(5,9,16,.72);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;padding:20px;box-shadow:var(--shadow)}
footer{color:var(--dim);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line);padding:16px;margin-top:30px}
@media(max-width:640px){.hdr{padding-top:10px}.logo{font-size:17px}.kpi .val{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div>
      <div class="logo">나스닥<span>발굴</span></div>
      <div class="tagline">등장 → 소멸 → 재등장 패턴 기반 장기 성장주 추적기</div>
    </div>
    <div class="mkts" id="mkts"></div>
  </div>
  <nav id="nav"></nav>
</header>
<div class="wrap"><main id="main"></main>
<footer>
본 앱의 기준값은 공개된 투자 방법론을 종합한 것으로 미래 수익을 보장하지 않습니다. 소형주는 상장폐지·회계부정·유동성 고갈 위험이 대형주보다 훨씬 큽니다.
모든 데이터는 사용자가 직접 입력하며 브라우저(localStorage)에만 저장됩니다. 반드시 백테스트로 검증하고, 잃어도 생활에 지장이 없는 금액 안에서만 운용하십시오.
모든 투자 판단과 결과의 책임은 사용자 본인에게 있습니다.
</footer></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   나스닥발굴 — 글로벌 성장주 발굴 앱  (단일 파일 / 오프라인 / localStorage)
   시장: 미국(US) · 중국(CN) · 일본(JP) · 한국(KR)

/* ── 위험 필터 (6-1 하드블록 / 6-2 경고) ─────────────────────────── */
/* auto: (f,c)=>bool 자동판정 · null이면 종목 데이터 화면의 체크박스(플래그) */
const AUTO = {
  price:(f,c)=> num(f.price)>0 && num(f.price) < c.minPrice,
  vol:  (f,c)=> num(f.advol)>0 && num(f.advol) < c.minVol,
  debt: (f,c)=> num(f.debtRatio) > c.maxDebt,

/* ── ISO 주차 계산 ── */
function isoLabel(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (t.getUTCDay()+6)%7;                 // 월=0
  t.setUTCDate(t.getUTCDate()-dn+3);              // 그 주 목요일
  const y = t.getUTCFullYear();
  const jan4 = new Date(Date.UTC(y,0,4));
  const w = 1 + Math.round(((t-jan4)/86400000 - 3 + ((jan4.getUTCDay()+6)%7))/7);
  return y+'-W'+String(w).padStart(2,'0');
}
function weekStart(y,w){
  const jan4 = new Date(Date.UTC(y,0,4));
  const dn = (jan4.getUTCDay()+6)%7;
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate()-dn+(w-1)*7);
  return mon;
}
const WK = 604800000;
function wIdx(label){ const p = String(label||'').split('-W'); if(p.length<2) return 0; return Math.round(weekStart(+p[0], +p[1]).getTime()/WK); }
function wLabel(idx){ return isoLabel(new Date(idx*WK + 86400000)); }
const thisWeek = ()=> isoLabel(new Date());

/* ═══════════════ 자체 지표 엔진 (RS / EPS / Sales) ═══════════════ */
function rsScore(f){
  if(!has(f.price)||!has(f.p63)||!has(f.p126)||!has(f.p189)||!has(f.p252)) return null;
  const p=num(f.price);
  const r3=p/num(f.p63)-1, r6=p/num(f.p126)-1, r9=p/num(f.p189)-1, r12=p/num(f.p252)-1;
  if(![r3,r6,r9,r12].every(isFinite)) return null;
  return 0.4*r3 + 0.2*r6 + 0.2*r9 + 0.2*r12;          // IBD 방식: 최근 3개월 2배 가중
}
function epsScore(f){ if(!has(f.epsQ)&&!has(f.epsY)) return null; return 0.5*num(f.epsQ) + 0.5*num(f.epsY); }
function salesScore(f){ if(!has(f.revQ)&&!has(f.revY)) return null; return 0.4*num(f.revQ) + 0.4*num(f.revY) + 0.2*num(f.revAccel); }

/* 전 종목 대비 백분위 → 1~99 레이팅 */
function ratings(){
  const fund = D().fund, keys = Object.keys(fund);
  const mk = fn => {
    const arr = keys.map(k=>({k, v:fn(fund[k])})).filter(o=>o.v!==null && isFinite(o.v));
    arr.sort((a,b)=>a.v-b.v);
    const out={};
    arr.forEach((o,i)=>{ out[o.k] = arr.length<2 ? 50 : Math.round(1 + (i/(arr.length-1))*98); });
    return out;
  };
  return { rs:mk(rsScore), eps:mk(epsScore), sales:mk(salesScore), n:keys.length };
}
function composite(t, R){
  const f = D().fund[t]||{};
  const rs = R.rs[t], gr = (R.sales[t]!=null? R.sales[t] : R.eps[t]);
  if(rs==null && gr==null) return null;
  const flow = clamp(50 + num(f.instDelta)*4, 1, 99);
  const marg = f.gpmTrend==='up'?90 : f.gpmTrend==='down'?20 : 60;
  return Math.round(0.3*(rs??50) + 0.3*(gr??50) + 0.2*flow + 0.2*marg);
}

/* ═══════════════ 등장 패턴 추적 엔진 (핵심) ═══════════════ */
/* 상태: NEW(4주 미만) / CONTINUOUS(4주+ 연속) / FADED(4주+ 체류 후 8주+ 미등장) / REAPPEARED */
function tickers(){
  const set = {};
  D().appear.forEach(a=>set[a.ticker]=1);
  Object.keys(D().fund).forEach(t=>set[t]=1);
  D().hold.forEach(h=>set[h.ticker]=1);
  return Object.keys(set).sort();
}
function logsOf(t){ return D().appear.filter(a=>a.ticker===t).sort((a,b)=>wIdx(a.week)-wIdx(b.week)); }

function pattern(t){
  const logs = logsOf(t);
  const res = { ticker:t, type:'NONE', logs, runs:[], absences:[], streak:0, total:logs.length,
                first:null, last:null, reappear:null, reCount:0, valid:false, validWhy:[], reStreak:0 };
  if(!logs.length) return res;
  const idx = [...new Set(logs.map(a=>wIdx(a.week)))].sort((a,b)=>a-b);
  const byIdx = {}; logs.forEach(a=>byIdx[wIdx(a.week)] = a);
  // 연속 구간(run) 묶기
  let run = [idx[0]];
  for(let i=1;i<idx.length;i++){ if(idx[i]-idx[i-1]===1) run.push(idx[i]); else { res.runs.push(run); run=[idx[i]]; } }
  res.runs.push(run);
  res.first = wLabel(idx[0]); res.last = wLabel(idx[idx.length-1]);
  const cur = wIdx(thisWeek());

  // 소멸 구간: 직전 4주+ 체류 & 8주+ 미등장
  for(let i=1;i<res.runs.length;i++){
    const prev = res.runs[i-1], next = res.runs[i];
    const gap = next[0] - prev[prev.length-1] - 1;
    if(prev.length>=4 && gap>=8){
      const ps = num((byIdx[prev[prev.length-1]]||{}).price), pe = num((byIdx[next[0]]||{}).price);
      const hi = Math.max(...prev.map(w=>num((byIdx[w]||{}).price)||0));
      res.absences.push({ start:wLabel(prev[prev.length-1]+1), end:wLabel(next[0]-1), weeks:gap,
        priceStart:ps, priceEnd:pe, hi, dd: (ps&&pe)? ((pe/ps-1)*100) : null,
        vsHi: (hi&&pe)? (pe/hi*100) : null, reIdx:next[0], runLen:next.length });
    }
  }
  const lastRun = res.runs[res.runs.length-1];
  const lastIdx = lastRun[lastRun.length-1];
  const active = (cur - lastIdx) <= 1;                       // 이번 주 또는 지난 주 등장 = 활성
  res.streak = active ? lastRun.length : 0;

  // 마지막 소멸 이후 재등장인가
  const lastAbs = res.absences.filter(a=>a.reIdx===lastRun[0]).pop();
  res.reCount = res.absences.length;
  if(lastAbs){
    const reLog = byIdx[lastRun[0]];
    const aOK = reLog && num(reLog.aCount)>0;                // C그룹 단독 재등장은 인정 안 함
    if(aOK){
      res.reappear = { week:wLabel(lastRun[0]), abs:lastAbs, streak:lastRun.length };
      res.reStreak = lastRun.length;
    }
  }
  // 상태 판정
  if(!active && lastRun.length>=4 && (cur-lastIdx)>=8) res.type='FADED';
  else if(res.reappear) res.type='REAPPEARED';
  else if(lastRun.length>=4) res.type = active ? 'CONTINUOUS' : 'FADING';
  else res.type = active ? 'NEW' : 'FADING';

  // 유효 재등장 판정
  if(res.reappear){
    const f = D().fund[t]||{}, c = C(), a = res.reappear.abs, w=[];
    const c1 = res.reappear.streak >= 4;
    const c2 = a.dd !== null && a.dd <= -30;
    const c3 = a.vsHi !== null ? a.vsHi <= 60 : (has(f.prevHigh)&&has(f.price) ? (num(f.price)/num(f.prevHigh)*100)<=60 : false);
    const c4 = has(f.revDuringFade) && num(f.revDuringFade) >= c.fadeRev;
    w.push({ok:c1, t:'재등장 후 4주 이상 연속 체류 ('+res.reappear.streak+'주)'});
    w.push({ok:c2, t:'소멸 구간 주가 하락 -30% 이상 ('+(a.dd!==null?a.dd.toFixed(1)+'%':'주가 미기록')+')'});
    w.push({ok:c3, t:'재등장 주가가 직전 고점의 60% 이하 ('+(a.vsHi!==null?a.vsHi.toFixed(0)+'%':'미기록')+')'});
    w.push({ok:c4, t:'소멸 기간에도 매출 성장률 '+c.fadeRev+'% 이상 유지 ★결정적 ('+(has(f.revDuringFade)?num(f.revDuringFade)+'%':'미입력')+')'});
    res.validWhy = w; res.valid = w.every(x=>x.ok);
  }
  return res;
}

/* ═══════════════ 등장 점수 시스템 ═══════════════ */
function scoreOf(t, p){
  p = p || pattern(t);
  const f = D().fund[t]||{}, c = C(), items = [];
  const add = (label, v) => { if(v) items.push({label, v}); };
  const recent = p.logs.slice(-1)[0] || {};
  const aC = num(recent.aCount), bC = (recent.b||[]).length, cC = num(recent.cCount);

  if(p.valid) add('유효 재등장 (Valid Reappearance)', 40);
  if(p.reStreak>0) add('재등장 후 연속 체류 '+p.reStreak+'주 (주당 +3)', Math.min(p.reStreak*3, 30));
  else if(p.streak>0) add('연속 체류 '+p.streak+'주 (주당 +2)', Math.min(p.streak*2, 25));
  if(aC) add('A그룹 소스 '+aC+'곳 (개당 +8)', Math.min(aC*8, 24));
  if(bC) add('B그룹 수급 신호 '+bC+'건 (개당 +10)', Math.min(bC*10, 20));
  if(has(f.revDuringFade) && num(f.revDuringFade) >= c.fadeRev) add('소멸 구간 중 매출 성장 유지', 15);
  if(num(f.revAccel) > 0) add('매출 성장 가속 (accel +'+num(f.revAccel)+'%p)', 10);
  if(cC) add('C그룹 언급 '+cC+'건', Math.min(cC, 3));
  if(aC===0 && bC===0 && cC>0) add('감점 — C그룹 단독 등장', -15);
  const gain = gainSinceFirst(t, p);
  if(gain !== null && gain >= c.gainCap) add('감점 — 등장 후 이미 '+gain.toFixed(0)+'% 상승 (진입 늦음)', -20);
  if(f.gpmTrend === 'down') add('감점 — 매출총이익률 하락 추세', -15);
  if(num(f.shareGrowth) >= 8) add('감점 — 주식수 연 '+num(f.shareGrowth)+'% 증가 (희석)', -20);

  const total = items.reduce((s,i)=>s+i.v, 0);
  return { total:Math.max(0, Math.round(total)), items, gain };
}
function gainSinceFirst(t, p){
  p = p || pattern(t);
  const f = D().fund[t]||{};
  const base = p.reappear ? num((p.logs.find(l=>l.week===p.reappear.week)||{}).price)
                          : num((p.logs[0]||{}).price);
  if(!base || !has(f.price)) return null;
  return (num(f.price)/base - 1)*100;
}

/* ═══════════════ 재무 6대 필수 조건 ═══════════════ */
function conds(t){
  const f = D().fund[t]||{}, c = C();
  const gpmMin = f.biz==='SW' ? c.gpmSW : c.gpmHW;
  const r = [
    {n:'① 매출 성장률', need:'연 '+c.rev+'%+ · '+c.revYears+'년 이상 지속',
     got: has(f.revY)? num(f.revY).toFixed(0)+'% / '+num(f.revYears)+'년' : '미입력',
     ok: has(f.revY) && num(f.revY)>=c.rev && num(f.revYears)>=c.revYears},
    {n:'② 매출총이익률', need:gpmMin+'%+ · 하락 추세 아님',
     got: has(f.gpm)? num(f.gpm).toFixed(0)+'% / '+({up:'상승',flat:'유지',down:'하락'}[f.gpmTrend]||'—') : '미입력',
     ok: has(f.gpm) && num(f.gpm)>=gpmMin && f.gpmTrend!=='down'},
    {n:'③ TAM', need:'현재 매출의 '+c.tamX+'배 이상',
     got: has(f.tamX)? num(f.tamX)+'배' : '미입력', ok: has(f.tamX) && num(f.tamX)>=c.tamX},
    {n:'④ 창업자 경영', need:'창업자 CEO · 지분 '+c.founderStake+'%+',
     got: (f.founderCEO?'창업자 CEO ':'전문경영인 ') + (has(f.founderStake)? num(f.founderStake)+'%':'—'),
     ok: !!f.founderCEO && num(f.founderStake)>=c.founderStake},
    {n:'⑤ 주식수 증가율', need:'연 '+c.shareGrowth+'% 이내',
     got: has(f.shareGrowth)? num(f.shareGrowth)+'%' : '미입력',
     ok: has(f.shareGrowth) && num(f.shareGrowth)<=c.shareGrowth},
    {n:'⑥ 현금 여력', need:c.runwayM+'개월 이상',
     got: has(f.runway)? num(f.runway)+'개월' : '미입력', ok: has(f.runway) && num(f.runway)>=c.runwayM}
  ];
  return { list:r, pass:r.every(x=>x.ok), passN:r.filter(x=>x.ok).length };
}
function bonuses(t){
  const f = D().fund[t]||{}, out=[];
  if(num(f.nrr)>=120) out.push('NRR '+num(f.nrr)+'%');
  if(num(f.instOwn)>=10 && num(f.instOwn)<=30) out.push('기관비중 '+num(f.instOwn)+'% (초기)');
  if(has(f.analysts) && num(f.analysts)>0 && num(f.analysts)<=3) out.push('커버리지 '+num(f.analysts)+'곳 (미발견)');
  if(num(f.revAccel)>0) out.push('성장 가속 +'+num(f.revAccel)+'%p');
  return out;
}

/* ═══════════════ 위험 필터 ═══════════════ */
function risks(t){
  const f = D().fund[t]||{}, c = C(), fl = f.flags||{}, F = FILT[S.mkt];
  const hard = F.hard.filter(x => x.auto ? x.auto(f,c) : !!fl[x.id]);
  const warn = F.warn.filter(x => x.auto ? x.auto(f,c) : !!fl[x.id]);
  const penalty = warn.reduce((s,x)=>s+(x.p||0),0);
  return { hard, warn, penalty, blocked:hard.length>0 };
}
/* 유동성 실사 — 내 포지션이 일평균 거래대금의 liqPct% 이하인가 */
function liquidity(t, amount){
  const f = D().fund[t]||{}, c = C(), v = num(f.advol);
  if(!v) return { ok:null, cap:0, msg:'거래대금 미입력' };
  const cap = v * c.liqPct/100;
  return { ok: amount<=cap, cap, adv:v,
    msg:'일평균 거래대금 '+bigMoney(v)+' · 최대 허용 포지션 '+bigMoney(cap)+' ('+c.liqPct+'%)' };
}

/* 전 종목 요약 (여러 화면 공용) */
function summary(){
  const R = ratings();
  return tickers().map(t=>{
    const p = pattern(t), sc = scoreOf(t,p), cd = conds(t), rk = risks(t), f = D().fund[t]||{};
    return { t, p, sc, cd, rk, f, rs:R.rs[t], eps:R.eps[t], sales:R.sales[t], comp:composite(t,R),
             net: Math.max(0, sc.total - rk.penalty) };
  });
}

/* ═══════════════ 1. 대시보드 ═══════════════ */
function alerts(rows){
  const out=[], c=C();
  rows.forEach(r=>{
    const held = D().hold.some(h=>h.ticker===r.t && !h.sold);
    if(r.rk.blocked && !held) return;          // 하드블록 종목은 후보 알림에서 제외
    if(r.p.valid && r.p.reStreak>=4 && !held)
      out.push({p:1,ic:'🔴',t:r.t+' — 유효 재등장 '+r.p.reStreak+'주 차 진입',
        d:'최우선 검토 대상. 소멸 구간 '+(r.p.reappear.abs.dd!==null?r.p.reappear.abs.dd.toFixed(0)+'%':'—')+' 조정 후 재등장, 소멸 중에도 매출 성장 유지. 점수 '+r.net+'점.'});
    else if(r.p.reappear && r.p.reStreak<4 && !held)
      out.push({p:2,ic:'🟠',t:r.t+' — 재등장 감지 ('+r.p.reStreak+'주 차)',
        d:'관찰 리스트 등록. 4주 연속 체류하면 유효 재등장으로 승격됩니다.'});
    else if(r.p.type==='CONTINUOUS' && r.p.streak>=12 && !held)
      out.push({p:3,ic:'🟡',t:r.t+' — '+r.p.streak+'주 연속 체류',
        d:'장기 체류 종목. 진입 시점이 늦지 않은지(등장 후 상승률 '+(r.sc.gain!==null?r.sc.gain.toFixed(0)+'%':'—')+') 확인.'});
    if(held && r.p.type==='FADED')
      out.push({p:5,ic:'🔵',t:r.t+' — 보유 종목이 FADED 전환',
        d:'검토 알림입니다. ⚠︎ 리스트에서 사라진 것은 매도 사유가 아닙니다. 분기 점검으로 사업 논리만 확인하십시오.'});
  });
  const held = D().hold.filter(h=>!h.sold);
  held.forEach(h=>{ const f=D().fund[h.ticker]||{}; if(has(f.earnDays)&&num(f.earnDays)<=7&&num(f.earnDays)>=0)
    out.push({p:3,ic:'🟡',t:h.ticker+' — 실적 발표 '+num(f.earnDays)+'일 뒤',d:'발표 후 분기 점검 체크리스트를 실행하십시오.'}); });
  return out.sort((a,b)=>a.p-b.p);
}

/* ═══════════════ 2. 패턴 추적 ═══════════════ */
function tlStart(p){
  const cur = wIdx(thisWeek());
  const first = p.logs.length ? wIdx(p.logs[0].week) : cur-51;
  return Math.min(first-3, cur-51);                 // 최초 등장부터 전부 보이도록 자동 확장
}
function timeline(p){
  const cur = wIdx(thisWeek()), start = tlStart(p), n = cur-start+1;
  const on = {}; p.logs.forEach(l=>on[wIdx(l.week)] = l);
  const reIdx = p.reappear ? wIdx(p.reappear.week) : null;
  let html = '<div class="tl">';
  for(let i=start;i<=cur;i++){
    const l = on[i];
    const cls = l ? (reIdx!==null && i>=reIdx ? 'on re' : 'on') : '';
    const h = l ? 8 + Math.min(18, num(l.aCount)*5 + (l.b||[]).length*3) : 5;
    html += '<i class="'+cls+'" style="height:'+h+'px" title="'+wLabel(i)+(l?' · A'+num(l.aCount)+' · '+money(l.price):'')+'"></i>';
  }
  return html+'</div>';
}
function tlBlock(p){
  return '<div class="tlwrap">'+timeline(p)
    +'<div class="row tiny dim" style="margin-top:5px"><span>'+wLabel(tlStart(p))+'</span><span class="sp"></span>'
    +(p.reappear? '<span style="color:var(--gold)">↑ 재등장 '+p.reappear.week+'</span><span class="sp"></span>':'')
    +'<span>'+thisWeek()+'</span></div></div>';
}

function parseTk(s){
  const out = {};
  String(s||'').split(/[\s,;\n\r]+/).filter(Boolean).forEach(tok=>{
    const m = tok.split(/[:@\/]/);           // "PLTR:24.5" 형식이면 등장 시점 주가 동시 입력
    const t = m[0].toUpperCase().replace(/[^A-Z0-9.\-]/g,'');
    if(t) out[t] = m[1] ? num(m[1]) : (out[t]||0);
  });
  return out;
}

function saveWeek(){
  const w = ($('#wk').value||'').trim();
  if(!/^\d{4}-W\d{2}$/.test(w)) return toast('주차 형식은 2026-W36 입니다');
  const src = SRC[S.mkt], d = D(), agg = {};
  const grab = (grade, list) => list.forEach((name,i)=>{
    const tks = parseTk(($('#src_'+grade+'_'+i)||{}).value);
    Object.keys(tks).forEach(t=>{
      agg[t] = agg[t] || {ticker:t, week:w, sources:[], b:[], c:[], price:0};
      if(grade==='A') agg[t].sources.push(name);
      if(grade==='B') agg[t].b.push(name);
      if(grade==='C') agg[t].c.push(name);
      if(tks[t]) agg[t].price = tks[t];
    });
  });
  grab('A',src.A); grab('B',src.B); grab('C',src.C);
  d.appear = d.appear.filter(a=>a.week!==w);
  Object.values(agg).forEach(a=>{
    a.aCount = a.sources.length; a.cCount = a.c.length;
    if(!a.price){ const f=d.fund[a.ticker]||{}; a.price = has(f.price)? num(f.price) : 0; }
    const f = d.fund[a.ticker]||{}; a.mcap = num(f.mcap);
    d.appear.push(a);
  });
  save(); toast(w+' 저장 — '+Object.keys(agg).length+'종목 기록'); render();
}
function delWeek(w){ if(!confirm(w+' 주차 기록을 삭제할까요?')) return; D().appear = D().appear.filter(a=>a.week!==w); save(); render(); }

/* ═══════════════ 6. 매수 체크리스트 (강제) ═══════════════ */
function buyBlocks(t, amount){
  const c=C(), r={p:pattern(t)}, sc=scoreOf(t,r.p), cd=conds(t), rk=risks(t), f=D().fund[t]||{};
  const held = D().hold.filter(h=>!h.sold);
  const already = held.filter(h=>h.ticker===t).reduce((s,h)=>s+num(h.amount),0);
  const weight = c.acctLong? (already+amount)/c.acctLong*100 : 0;
  const L = liquidity(t, amount);
  const net = Math.max(0, sc.total - rk.penalty);
  return { list:[
    {ok:!rk.blocked, t:'6-1 즉시 제외 항목에 걸리지 않는다', d: rk.blocked? rk.hard.map(h=>h.t).join(' / ') : '하드블록 없음'},
    {ok:net>=c.pass, t:'등장 점수 '+c.pass+'점 이상', d:'현재 '+net+'점 (원점수 '+sc.total+' − 감점 '+rk.penalty+')'},
    {ok:cd.pass, t:'재무 6대 필수 조건 전부 통과', d: cd.passN+'/6 통과' + (cd.pass?'':' — '+cd.list.filter(x=>!x.ok).map(x=>x.n).join(', ')+' 실패')},
    {ok:held.length < c.maxHold, t:'보유 종목이 '+c.maxHold+'개 미만', d:'현재 '+held.length+'개'},
    {ok:weight <= c.maxPct, t:'장기 계좌의 '+c.maxPct+'%를 초과하지 않는다', d:'매수 후 비중 '+weight.toFixed(1)+'% (기존 '+money(already)+')'},
    {ok:L.ok!==false, t:'포지션이 일평균 거래대금의 '+c.liqPct+'% 이하', d:L.msg},
    {ok:!(has(f.earnDays)&&num(f.earnDays)<=c.earnDays), t:'실적 발표가 '+c.earnDays+'일 이내가 아니다', d: has(f.earnDays)? num(f.earnDays)+'일 뒤':'미입력'},
    {ok:!(sc.gain!==null && sc.gain>=c.gainCap), t:'등장 후 '+c.gainCap+'% 이상 오르지 않았다', d: sc.gain!==null? sc.gain.toFixed(0)+'% 상승':'주가 미기록'}
  ], sc, cd, rk, net, weight, L };
}

    {ok: has(f.shareGrowth)&&num(f.shareGrowth)<=c.shareGrowth, t:'주식수 증가율 연 '+c.shareGrowth+'% 이내', d: has(f.shareGrowth)? num(f.shareGrowth)+'%':'미입력'},

     <span>${esc(x.t)}<div class="tiny dim">${esc(x.d)}</div></span></div>`;
  return `<div class="sec-hd"><h2>매수 체크리스트</h2><span class="dim small">통과하지 못하면 기록할 수 없습니다</span></div>
  <div class="card"><div class="row">
    <label class="f" style="margin:0;width:180px"><span>종목</span>
      <select onchange="keepDraft();S.sel=this.value;render()">${list.map(x=>`<option ${x===t?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
    <label class="f" style="margin:0;width:200px"><span>매수 금액 (${MM().cur})</span>
      <input type="number" step="any" value="${amount}" onchange="keepDraft();S.buyAmt=this.value;render()"></label>
    <label class="f" style="margin:0;width:150px"><span>매수 단가</span>

    <div class="sp"></div><div style="text-align:right"><div class="dim tiny">계좌 대비 비중</div>
      <div class="score ${B.weight<=C().maxPct?'s-md':'s-lo'}">${B.weight.toFixed(1)}%</div></div>
  </div></div>

  <div class="${blocked?'blk':'pass'}"><b>A. 매수 금지 조건 — 하나라도 해당하면 차단</b>
    ${B.list.map(line).join('')}
    <div style="margin-top:6px">${blocked?'<span class="b no">차단됨 — 위 항목을 해결하기 전에는 매수 기록 불가</span>':'<span class="b ok">A 전부 통과</span>'}</div></div>

  <div class="card"><b>B. 매수 조건 확인</b>${okB.map(line).join('')}
    <div class="tiny dim" style="margin-top:6px">B는 차단 조건이 아니라 판단 근거입니다. ✘가 3개 이상이면 다시 생각하십시오. (현재 ✘ ${okB.filter(x=>!x.ok).length}개)</div></div>

  <div class="card"><b>C. 심리 · 논리 점검 <span style="color:var(--bad)">(건너뛰기 불가)</span></b>
    <div class="note" style="margin:8px 0">아래 세 문항을 쓰지 못하면 <b>매수하면 안 되는 종목</b>입니다. 이 답변은 저장되어 분기 점검마다 다시 표시됩니다.</div>
    <label class="f"><span>① 이 회사가 10년 뒤에도 존재해야 하는 이유를 한 문장으로 쓰시오 (20자 이상)</span>
      <textarea id="q1">${esc(d.q1||'')}</textarea></label>
    <label class="f"><span>② 이 회사의 매출이 10배가 되려면 무슨 일이 일어나야 하는가 (20자 이상)</span>
      <textarea id="q2">${esc(d.q2||'')}</textarea></label>
    <label class="f"><span>③ 어떤 사실이 확인되면 내 판단이 틀린 것인가 — 매도 조건 (20자 이상)</span>
      <textarea id="q3">${esc(d.q3||'')}</textarea></label>
    <label class="chk"><input type="checkbox" id="q4" ${d.q4?'checked':''}><span>이 종목이 <b>-70% 빠져도 팔지 않을 자신</b>이 있다 (Y)</span></label>
    <label class="chk"><input type="checkbox" id="q5" ${d.q5?'checked':''}><span>남들이 사서 / 놓칠까 봐 / 유튜브에서 봐서 사는 것이 <b>아니다</b> (N)</span></label>
    <label class="chk"><input type="checkbox" id="q6" ${d.q6?'checked':''}><span><b style="color:var(--warn)">이 돈이 없어도 생활에 지장이 없다</b>고 말할 수 있다 — 이 계좌는 "없는 돈"이다</span></label>
  </div>
  <div class="row"><button class="btn" onclick="doBuy('${esc(t)}')" ${blocked?'disabled':''}>매수 기록 · 보유 종목 등록</button>
    ${blocked?'<span class="small" style="color:var(--bad)">A 조건 미통과 — 버튼 비활성</span>':'<span class="small muted">서술형 3문항과 체크 3개를 모두 채워야 저장됩니다.</span>'}</div>`;
}
function keepDraft(){
  S.draft = { q1:($('#q1')||{}).value||'', q2:($('#q2')||{}).value||'', q3:($('#q3')||{}).value||'',
              q4:($('#q4')||{}).checked, q5:($('#q5')||{}).checked, q6:($('#q6')||{}).checked };
}
function doBuy(t){
  keepDraft(); const d=S.draft, c=C();
  if((d.q1||'').trim().length<20 || (d.q2||'').trim().length<20 || (d.q3||'').trim().length<20)
    return toast('서술형 3문항을 각각 20자 이상 작성하십시오');
  if(!d.q4) return toast('-70%를 견딜 수 없다면 매수해서는 안 됩니다');
  if(!d.q5) return toast('FOMO 매수는 이 전략의 실패 요인입니다');
  if(!d.q6) return toast('생활자금으로는 이 계좌를 운용할 수 없습니다');
  const amount = S.buyAmt!==undefined? num(S.buyAmt) : Math.round(c.acctLong*c.initPct/100);
  const px = num(($('#buyPx')||{}).value) || num((D().fund[t]||{}).price);
  if(!px) return toast('매수 단가를 입력하십시오');
  const B = buyBlocks(t, amount);
  const h = { id:Date.now(), ticker:t, date:new Date().toISOString().slice(0,10), price:px,
    amount, shares:+(amount/px).toFixed(4), score:B.net, pattern:pattern(t).type,
    thesis:{ why:d.q1.trim(), tenx:d.q2.trim(), sell:d.q3.trim() },
    snap:{ revY:(D().fund[t]||{}).revY, gpm:(D().fund[t]||{}).gpm, shareGrowth:(D().fund[t]||{}).shareGrowth, runway:(D().fund[t]||{}).runway },
    reviews:[], sold:false };
  D().hold.push(h);
  D().jrnl.push({ id:Date.now()+1, ticker:t, date:h.date, act:'BUY', price:px, amount, shares:h.shares,
                  note:'점수 '+B.net+' · 패턴 '+h.pattern+' · '+d.q1.trim().slice(0,60) });
  S.draft={}; S.buyAmt=undefined; save(); toast(t+' 매수 기록 완료'); go('hold');
}

/* ═══════════════ 7. 보유 종목 · 분기 점검 · 매도 규칙 ═══════════════ */
function sellSignals(h){
  const f = D().fund[h.ticker]||{}, rv = h.reviews||[], out=[];
  const last2 = rv.slice(-2), last3 = rv.slice(-3);
  if(last2.length===2 && last2.every(r=>has(r.rev)&&num(r.rev)<20)) out.push('매출 성장률이 2개 분기 연속 20% 미만');
  if(last3.length===3 && num(last3[0].gpm)>num(last3[1].gpm) && num(last3[1].gpm)>num(last3[2].gpm)) out.push('매출총이익률이 3개 분기 연속 하락');
  if(num(f.shareGrowth)>=10) out.push('발행주식수 연 10% 이상 증가 (심각한 희석)');
  if(rv.some(r=>r.founderOut)) out.push('창업자 CEO 사임 또는 지분 대량 매도');
  if(rv.some(r=>r.sellHit)) out.push('매수 시 작성한 "매도 조건"이 실제로 발생');
  const fl = f.flags||{};
  if(fl.goingConcern||fl.gcNote||fl.nonStdAudit||fl.adverse) out.push('계속기업 불확실성 / 비적정 감사의견');
  if(fl.auditRestate||fl.embezzle) out.push('회계 부정 · 실적 재작성 · 횡령배임');
  return out;
}

        <span>보유 비중 <b style="color:var(--txt)">${w.toFixed(1)}%</b></span><span>계좌 비중 ${wAcct.toFixed(1)}%</span>

    </div>`;

function reviewM(id){
  const h = D().hold.find(x=>x.id===id), f = D().fund[h.ticker]||{};
  const Q = [['q1','매출 성장률이 여전히 25% 이상인가'],['q2','매출총이익률이 유지 또는 개선됐는가'],
    ['q3','발행주식수가 예상보다 늘지 않았는가'],['q4','현금 소진 속도가 빨라지지 않았는가'],

/* ═══════════════ 8. 매매일지 · 성과 · 백테스트 ═══════════════ */
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; };
const mean   = a => a.length? a.reduce((s,v)=>s+v,0)/a.length : 0;

function perfStats(){
  const rows = D().hold.map(h=>{
    const f = D().fund[h.ticker]||{};
    const px = h.sold? num(h.soldPrice) : (has(f.price)? num(f.price) : num(h.price));
    const ret = (px/num(h.price)-1)*100, pnl = (px-num(h.price))*num(h.shares);
    return { h, px, ret, pnl, cost:num(h.amount) };
  });
  const rets = rows.map(r=>r.ret), pnls = rows.map(r=>r.pnl);
  const win = rets.filter(r=>r>0).length;
  const gains = pnls.filter(p=>p>0).sort((a,b)=>b-a);
  const top20n = Math.max(1, Math.round(rows.length*0.2));
  const top20 = pnls.slice().sort((a,b)=>b-a).slice(0,top20n).reduce((s,v)=>s+v,0);
  const totalPnl = pnls.reduce((s,v)=>s+v,0);
  return { rows, n:rows.length, win, winRate: rows.length? win/rows.length*100:0,
    avg:mean(rets), med:median(rets), totalPnl, top20, top20Share: totalPnl>0? top20/totalPnl*100 : 0,
    invested: rows.reduce((s,r)=>s+r.cost,0) };
}
/* 백테스트 — 입력된 등장 로그 + 현재가 기반 코호트 비교 (거래비용 0.5% 반영) */
function backtest(hold){
  hold = hold||12;
  const cost = 0.5, out = { cont:[], re:[] };
  tickers().forEach(t=>{
    const p = pattern(t), f = D().fund[t]||{};
    if(!has(f.price)) return;
    const px = num(f.price);
    // 코호트1: 12주 이상 연속 체류 → 12주차 등장 시점 매수
    const long = p.runs.find(r=>r.length>=hold);
    if(long){
      const entryLog = p.logs.find(l=>wIdx(l.week)===long[hold-1]);
      const ep = num((entryLog||{}).price);
      if(ep) out.cont.push({t, ep, px, ret:(px/ep-1)*100 - cost});
    }
    // 코호트2: 재등장 후 4주 차 매수
    if(p.reappear && p.reStreak>=4){
      const st = wIdx(p.reappear.week);
      const entryLog = p.logs.find(l=>wIdx(l.week)===st+3);
      const ep = num((entryLog||{}).price);
      if(ep) out.re.push({t, ep, px, ret:(px/ep-1)*100 - cost});
    }
  });
  const stat = arr => {
    const r = arr.map(x=>x.ret);
    const top = arr.slice().sort((a,b)=>b.ret-a.ret).slice(0, Math.max(1,Math.round(arr.length*0.2)));
    const sum = r.reduce((s,v)=>s+v,0);
    return { n:arr.length, win: r.filter(v=>v>0).length, winRate: r.length? r.filter(v=>v>0).length/r.length*100:0,
      avg:mean(r), med:median(r), mdd:mddOf(arr), topShare: sum>0? top.reduce((s,x)=>s+x.ret,0)/sum*100:0, list:arr };
  };
  return { cont:stat(out.cont), re:stat(out.re), hold };
}
/* 등장 기록 주가 시계열로 근사 MDD 산출 */
function mddOf(arr){
  let worst = 0;
  arr.forEach(x=>{
    const p = pattern(x.t), series = p.logs.map(l=>num(l.price)).filter(v=>v>0);
    let peak = 0, dd = 0;
    series.forEach(v=>{ peak = Math.max(peak, v); if(peak) dd = Math.min(dd, (v/peak-1)*100); });
    worst = Math.min(worst, dd);
  });
  return worst;
}
