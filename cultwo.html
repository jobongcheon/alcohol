<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컬투쇼 사연 게시판 (비공식 팬 프로젝트)</title>
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #7a6a5a;
    --line: #eadcc6;
    --accent: #ff6b35;
    --accent-ink: #ffffff;
    --accent-soft: #ffe3d6;
    --funny: #ffb703;
    --touching: #4ea8de;
    --absurd: #9b5de5;
    --shadow: 0 6px 20px rgba(80, 50, 20, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1712;
      --card: #28211a;
      --ink: #f4ebe0;
      --muted: #b3a493;
      --line: #3d3329;
      --accent: #ff8a5c;
      --accent-ink: #1c1712;
      --accent-soft: #4a2c1f;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1712;
    --card: #28211a;
    --ink: #f4ebe0;
    --muted: #b3a493;
    --line: #3d3329;
    --accent: #ff8a5c;
    --accent-ink: #1c1712;
    --accent-soft: #4a2c1f;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 0 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 36px 0 20px;
  }
  .onair {
    display: inline-flex; align-items: center; gap: 8px;
    background: #e63946; color: #fff;
    font-weight: 800; letter-spacing: 2px; font-size: 0.8rem;
    padding: 4px 12px; border-radius: 999px;
  }
  .onair::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #fff; animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }
  header h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 12px 0 4px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.95rem; }
  .disclaimer { font-size: 0.78rem; margin-top: 6px; }

  section { margin-top: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  h2 { font-size: 1.15rem; margin-bottom: 12px; }

  /* Soundboard */
  .sounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .sound-btn {
    border: none; border-radius: 12px; padding: 14px 8px;
    background: var(--accent-soft); color: var(--ink);
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: transform 0.08s;
  }
  .sound-btn:active { transform: scale(0.95); }
  .sound-btn .emo { display: block; font-size: 1.6rem; }

  /* Form */
  form { display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  label { display: grid; gap: 4px; font-size: 0.88rem; font-weight: 600; color: var(--muted); }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .count { text-align: right; font-size: 0.78rem; color: var(--muted); }
  .error { color: #e63946; font-size: 0.85rem; min-height: 1.2em; }
  .primary {
    border: none; border-radius: 12px; padding: 12px;
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 800; cursor: pointer;
  }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toolbar select { width: auto; padding: 6px 10px; font-size: 0.85rem; }

  /* Stories */
  .stories { display: grid; gap: 12px; }
  .story { padding: 18px; }
  .story-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag { font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; color: #fff; }
  .tag.funny { background: var(--funny); color: #2b2118; }
  .tag.touching { background: var(--touching); }
  .tag.absurd { background: var(--absurd); }
  .story h3 { font-size: 1.05rem; word-break: break-word; }
  .meta { font-size: 0.8rem; color: var(--muted); }
  .body { margin: 8px 0 12px; white-space: pre-wrap; word-break: break-word; }
  .body.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .act {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .act.liked { background: var(--accent-soft); border-color: var(--accent); }
  .act.reading { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 32px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 0.9rem; transition: transform 0.25s, opacity 0.25s; opacity: 0; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="onair">ON AIR</span>
    <h1>컬투쇼 <span>사연 게시판</span></h1>
    <p>웃기고, 찡하고, 황당한 우리들의 이야기를 들려주세요!</p>
    <p class="disclaimer">※ 방송사와 관계없는 비공식 팬 프로젝트입니다. 작성한 사연은 이 브라우저에만 저장되며 방송국으로 전송되지 않습니다.</p>
  </header>

  <section class="card" aria-labelledby="sb-title">
    <h2 id="sb-title">🎛️ 스튜디오 효과음</h2>
    <div class="sounds">
      <button class="sound-btn" data-sound="rimshot"><span class="emo">🥁</span>바둠츠</button>
      <button class="sound-btn" data-sound="applause"><span class="emo">👏</span>박수</button>
      <button class="sound-btn" data-sound="boing"><span class="emo">🌀</span>띠용</button>
      <button class="sound-btn" data-sound="dingdong"><span class="emo">🔔</span>딩동댕</button>
      <button class="sound-btn" data-sound="fail"><span class="emo">📉</span>땡~</button>
    </div>
  </section>

  <section class="card" aria-labelledby="form-title">
    <h2 id="form-title">✍️ 사연 보내기</h2>
    <form id="storyForm" novalidate>
      <div class="row">
        <label>닉네임
          <input id="nick" maxlength="12" placeholder="예: 출근길 김대리" autocomplete="nickname">
        </label>
        <label>사연 종류
          <select id="category">
            <option value="funny">😂 웃긴 사연</option>
            <option value="touching">🥹 감동 사연</option>
            <option value="absurd">🤯 황당 사연</option>
          </select>
        </label>
      </div>
      <label>제목
        <input id="title" maxlength="40" placeholder="사연 제목을 적어주세요">
      </label>
      <label>사연 내용
        <textarea id="content" maxlength="1000" placeholder="있었던 일을 자유롭게 들려주세요 (10자 이상)"></textarea>
      </label>
      <div class="count"><span id="charCount">0</span> / 1000</div>
      <div class="error" id="formError" role="alert"></div>
      <button type="submit" class="primary">📮 사연 보내기</button>
    </form>
  </section>

  <section aria-labelledby="list-title">
    <div class="toolbar">
      <h2 id="list-title" style="margin:0">📻 도착한 사연 <span class="meta" id="total"></span></h2>
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="likes">공감순</option>
      </select>
    </div>
    <div class="chips" role="group" aria-label="사연 종류 필터" style="margin-bottom:12px">
      <button class="chip" data-filter="all" aria-pressed="true">전체</button>
      <button class="chip" data-filter="funny" aria-pressed="false">😂 웃긴</button>
      <button class="chip" data-filter="touching" aria-pressed="false">🥹 감동</button>
      <button class="chip" data-filter="absurd" aria-pressed="false">🤯 황당</button>
    </div>
    <div class="stories" id="stories"></div>
  </section>

  <footer>비공식 팬 프로젝트 · 예시 사연은 모두 지어낸 이야기입니다.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const STORE_KEY = 'cultwo-stories-v1';
  const LIKE_KEY = 'cultwo-liked-v1';
  const CAT = {
    funny: { label: '웃긴 사연', emo: '😂' },
    touching: { label: '감동 사연', emo: '🥹' },
    absurd: { label: '황당 사연', emo: '🤯' },
  };

  const now = Date.now();
  const SEED = [
    { id: 's1', nick: '출근길 김대리', category: 'funny', title: '엘리베이터에서 부장님께 "엄마"라고 했어요',
      content: '아침에 정신없이 출근하다가 엘리베이터 문이 닫히려는 순간 부장님이 "잡아줘!" 하시길래 반사적으로 "네 엄마!" 라고 외쳤습니다.\n\n그 뒤로 부장님이 저를 볼 때마다 "우리 아들 왔니?" 하십니다. 퇴사하고 싶어요.',
      likes: 42, mine: false, created: now - 1000 * 60 * 60 * 5 },
    { id: 's2', nick: '세 아이 아빠', category: 'touching', title: '막내가 처음으로 쓴 편지',
      content: '일곱 살 막내가 삐뚤빼뚤한 글씨로 "아빠 회사 가지 마 내가 돈 벌게"라고 편지를 써서 지갑에 넣어놨더라고요. 안에 100원짜리 동전 세 개가 들어 있었습니다. 그 300원, 평생 못 쓸 것 같아요.',
      likes: 87, mine: false, created: now - 1000 * 60 * 60 * 26 },
    { id: 's3', nick: '배달의 민족대표', category: 'absurd', title: '제가 시킨 치킨을 제가 배달했습니다',
      content: '배달 아르바이트 중에 콜을 잡았는데 주소가 낯이 익더라고요. 도착해 보니 우리 집. 알고 보니 동생이 제 폰으로 주문해 놓고 잠들었던 겁니다. 배달비는 받았습니다.',
      likes: 63, mine: false, created: now - 1000 * 60 * 60 * 50 },
  ];

  // ---------- storage (fails safely in private mode) ----------
  const load = (key, fallback) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  };
  const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

  let stories = load(STORE_KEY, null);
  if (!Array.isArray(stories)) { stories = SEED.slice(); save(STORE_KEY, stories); }
  let liked = new Set(load(LIKE_KEY, []));
  let filter = 'all';
  let sort = 'new';
  const expanded = new Set();

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const timeAgo = (t) => {
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 전`;
    return `${Math.floor(h / 24)}일 전`;
  };
  let toastTimer;
  const toast = (msg) => {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  };

  // ---------- sound effects (Web Audio, synthesized) ----------
  let ctx;
  const ac = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (freq, start, dur, type = 'sine', vol = 0.3, endFreq) => {
    const c = ac();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime + start);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, c.currentTime + start + dur);
    g.gain.setValueAtTime(vol, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start);
    o.stop(c.currentTime + start + dur + 0.05);
  };
  const noise = (start, dur, vol = 0.3, hp = 1000) => {
    const c = ac();
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(c.currentTime + start);
  };
  const SOUNDS = {
    rimshot() { tone(180, 0, 0.12, 'triangle', 0.5, 90); tone(150, 0.18, 0.12, 'triangle', 0.5, 80); noise(0.36, 0.6, 0.35, 5000); },
    applause() { for (let i = 0; i < 70; i++) noise(Math.random() * 2, 0.04 + Math.random() * 0.04, 0.12 + Math.random() * 0.1, 1500); },
    boing() { tone(120, 0, 0.6, 'sine', 0.4, 600); tone(600, 0.6, 0.2, 'sine', 0.2, 300); },
    dingdong() { tone(523.25, 0, 0.4, 'sine', 0.35); tone(659.25, 0.3, 0.4, 'sine', 0.35); tone(783.99, 0.6, 0.8, 'sine', 0.35); },
    fail() { tone(392, 0, 0.3, 'square', 0.15); tone(370, 0.3, 0.3, 'square', 0.15); tone(349, 0.6, 0.3, 'square', 0.15); tone(330, 0.9, 0.8, 'square', 0.15, 300); },
  };
  document.querySelectorAll('.sound-btn').forEach((b) =>
    b.addEventListener('click', () => SOUNDS[b.dataset.sound]()));

  // ---------- read aloud (speechSynthesis) ----------
  let readingId = null;
  const canSpeak = 'speechSynthesis' in window;
  const stopReading = () => {
    if (canSpeak) speechSynthesis.cancel();
    readingId = null;
    render();
  };
  const readAloud = (s) => {
    if (!canSpeak) { toast('이 브라우저는 음성 낭독을 지원하지 않아요'); return; }
    if (readingId === s.id) { stopReading(); return; }
    speechSynthesis.cancel();
    const text = `${s.nick} 님이 보내주신 ${CAT[s.category].label}입니다. 제목, ${s.title}. ${s.content}`;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    const ko = speechSynthesis.getVoices().find((v) => v.lang && v.lang.startsWith('ko'));
    if (ko) u.voice = ko;
    u.rate = 1.05;
    u.onend = () => {
      if (readingId !== s.id) return;
      readingId = null;
      render();
      (s.category === 'touching' ? SOUNDS.dingdong : s.category === 'absurd' ? SOUNDS.boing : SOUNDS.rimshot)();
    };
    readingId = s.id;
    render();
    speechSynthesis.speak(u);
  };

  // ---------- render ----------
  const render = () => {
    let list = stories.filter((s) => filter === 'all' || s.category === filter);
    list.sort(sort === 'likes'
      ? (a, b) => b.likes - a.likes || b.created - a.created
      : (a, b) => b.created - a.created);
    $('#total').textContent = `(${list.length})`;
    const box = $('#stories');
    if (!list.length) {
      box.innerHTML = '<div class="card empty">아직 사연이 없어요. 첫 사연의 주인공이 되어 주세요! 🎙️</div>';
      return;
    }
    box.innerHTML = list.map((s) => {
      const long = s.content.length > 160 || s.content.split('\n').length > 4;
      const open = expanded.has(s.id);
      return `
      <article class="card story" data-id="${esc(s.id)}">
        <div class="story-head">
          <span class="tag ${esc(s.category)}">${CAT[s.category].emo} ${CAT[s.category].label}</span>
          <span class="meta">${esc(s.nick)} · ${timeAgo(s.created)}</span>
        </div>
        <h3>${esc(s.title)}</h3>
        <p class="body ${long && !open ? 'clamped' : ''}">${esc(s.content)}</p>
        <div class="actions">
          <button class="act ${liked.has(s.id) ? 'liked' : ''}" data-act="like" aria-pressed="${liked.has(s.id)}">❤️ 공감 ${s.likes}</button>
          <button class="act ${readingId === s.id ? 'reading' : ''}" data-act="read">${readingId === s.id ? '⏹️ 낭독 중지' : '🎙️ 낭독 듣기'}</button>
          ${long ? `<button class="act" data-act="toggle">${open ? '접기' : '더보기'}</button>` : ''}
          ${s.mine ? '<button class="act" data-act="delete">🗑️ 삭제</button>' : ''}
        </div>
      </article>`;
    }).join('');
  };

  $('#stories').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.closest('.story').dataset.id;
    const s = stories.find((x) => x.id === id);
    if (!s) return;
    switch (btn.dataset.act) {
      case 'like':
        if (liked.has(id)) { liked.delete(id); s.likes = Math.max(0, s.likes - 1); }
        else { liked.add(id); s.likes++; }
        save(STORE_KEY, stories); save(LIKE_KEY, [...liked]);
        break;
      case 'read': readAloud(s); return;
      case 'toggle': expanded.has(id) ? expanded.delete(id) : expanded.add(id); break;
      case 'delete':
        if (!confirm('이 사연을 삭제할까요?')) return;
        if (readingId === id) stopReading();
        stories = stories.filter((x) => x.id !== id);
        liked.delete(id);
        save(STORE_KEY, stories); save(LIKE_KEY, [...liked]);
        toast('사연을 삭제했어요');
        break;
    }
    render();
  });

  document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
    filter = c.dataset.filter;
    document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
    render();
  }));
  $('#sort').addEventListener('change', (e) => { sort = e.target.value; render(); });

  // ---------- form ----------
  const content = $('#content');
  content.addEventListener('input', () => { $('#charCount').textContent = content.value.length; });

  $('#storyForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = $('#nick').value.trim();
    const title = $('#title').value.trim();
    const body = content.value.trim();
    const category = $('#category').value;
    const err = !nick ? '닉네임을 입력해 주세요.'
      : !title ? '제목을 입력해 주세요.'
      : body.length < 10 ? '사연은 10자 이상 써 주세요.'
      : !CAT[category] ? '사연 종류를 선택해 주세요.' : '';
    $('#formError').textContent = err;
    if (err) return;
    const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    stories.push({ id, nick, category, title, content: body, likes: 0, mine: true, created: Date.now() });
    save(STORE_KEY, stories);
    $('#title').value = ''; content.value = ''; $('#charCount').textContent = '0';
    filter = 'all'; sort = 'new';
    $('#sort').value = 'new';
    document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.filter === 'all')));
    render();
    SOUNDS.applause();
    toast('사연이 접수되었습니다! 📮');
    document.getElementById('list-title').scrollIntoView({ behavior: 'smooth' });
  });

  if (canSpeak) speechSynthesis.onvoiceschanged = () => {};
  window.addEventListener('beforeunload', () => { if (canSpeak) speechSynthesis.cancel(); });
  render();
})();
</script>
</body>
</html>
